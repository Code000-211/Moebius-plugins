# The package manifest of the Podman sandbox plugin, in the layout of the package manager's manifest (Moebius #172).

name = "podman-sandbox"
version = "0.1.0"
kind = "plugin"
description = "Runs every Pi-Bolt process in a rootless Podman container of the project's image, built from a Dockerfile set on the repository's page or named in its settings: its worktree, a few read-only paths and, by default, only the Moebius router."
license = "Apache-2.0"
homepage = "https://github.com/Code000-211/moebius-plugins/tree/main/plugins/podman-sandbox"

# The Moebius versions it works with: the ones that have the launcher kind.
moebius = ">=0.2"

# Rootless Podman runs containers without a virtual machine on Linux only.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]

[plugin]
# What it is: a program speaking the process plugin protocol as a launcher.
kind = "launcher"
program = "podman-sandbox"
# The [[plugins]] entry that installs it needs `launches = true`.
launches = true
# The core's [[plugins]] entry has no table of settings, so the settings are the program's arguments.
settings_as = "args"

# The programs it needs besides Moebius: rootless Podman 4.4 or later, and pasta (the package passt).
[plugin.requires]
podman = ">=4.4"
pasta = "*"

[[plugin.settings]]
name = "podman"
flag = "--podman"
type = "string"
default = "podman"
description = "The Podman program."

[[plugin.settings]]
name = "image"
flag = "--image"
type = "string"
description = "The image of a run whose repository has neither a Dockerfile nor an image of its own, and of a chat without a repository. It must be in Podman's storage; the plugin never pulls it."

[[plugin.settings]]
name = "repositories.<name>.image"
flag = "--repo-image"
type = "list of <repository>=<image>"
repeatable = true
default = []
description = "The image of the runs of one repository without a Dockerfile, by its name in Moebius, such as shop=localhost/shop:latest."

[[plugin.settings]]
name = "network"
flag = "--network"
type = "string"
choices = ["moebius", "internet"]
default = "moebius"
description = "moebius: a run reaches only the router's, the gateway's and the tool-call check's ports on the host's loopback, and nothing of any other machine. internet: those and general outbound access."

[[plugin.settings]]
name = "agents.<name>.network"
flag = "--agent-network"
type = "list of <agent>=<mode>"
repeatable = true
default = []
description = "The network mode for one agent, such as Researcher=internet."

[[plugin.settings]]
name = "caches"
flag = "--cache"
type = "list of <volume>:<path>"
repeatable = true
default = []
description = "A named Podman volume mounted at a path of the container and kept between runs, such as moebius-npm:/home/moebius/.npm. Every run of every agent shares it."

[[plugin.settings]]
name = "exclude_agents"
flag = "--exclude-agent"
type = "list of strings"
repeatable = true
default = []
description = "Agents that run without the sandbox, such as the Moebius agent, which operates the server with \"$MOEBIUS\"."
