[package]
name = "moebius-plugin-podman-sandbox"
version = "0.1.0"
description = "A Moebius launcher plugin that runs every Pi-Bolt process in a rootless Podman container."
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[lib]
name = "podman_sandbox"

[[bin]]
name = "podman-sandbox"
path = "src/main.rs"

[dependencies]
# Until the Moebius change that adds project settings is pushed: then this goes back to `git` and its full `rev`.
moebius-plugin-api = { path = "../../../Moebius/crates/moebius-plugin-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
