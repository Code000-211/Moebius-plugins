name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The nono version the plugin is pinned to (PINNED_NONO_VERSION in plugins/nono-sandbox/src/lib.rs).
  NONO_VERSION: v0.81.0
  # The sha256 of nono-v0.81.0-x86_64-unknown-linux-gnu.tar.gz; change it with the version.
  NONO_SHA256: 7ecc33ff9c349bdfa84b4496e7a7555f67bcc33f1e125c7df9efb653c6c4e569

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # The tests read the workflows and manifests as committed, with LF line ends, on Windows too.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # On Windows the plugin refuses to start; its test checks that, and the Unix-only tests are not built.
      - run: cargo test --workspace --no-fail-fast

  index:
    name: index.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p moebius-plugins-index
      # Every manifest is valid, and index.toml, if it is there, parses as Moebius reads it and fits the manifests: no
      # version newer than a manifest's, and the entries of released versions are what their manifests say.
      - run: cargo run -q -p moebius-plugins-index -- check

  e2e:
    name: end to end with nono
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - name: Install the pinned nono
        run: |
          curl -fsSL "https://github.com/nolabs-ai/nono/releases/download/${NONO_VERSION}/nono-${NONO_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o nono.tar.gz
          echo "${NONO_SHA256}  nono.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar xzf nono.tar.gz -C "$HOME/.local/bin" nono
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # By its full path: the tests start nono with the run's environment, whose PATH does not hold ~/.local/bin.
          echo "MOEBIUS_E2E_NONO=$HOME/.local/bin/nono" >> "$GITHUB_ENV"
          "$HOME/.local/bin/nono" --version
          # The tests of mode "moebius" need the kernel to filter TCP by port; fail here, with nono's own words, if not.
          "$HOME/.local/bin/nono" setup --check-only | tee setup.txt
          grep -q "TCP network rule support verified" setup.txt
      - run: cargo test -p moebius-plugin-nono-sandbox --test e2e -- --nocapture

  e2e-podman:
    name: end to end with rootless Podman
    runs-on: ubuntu-latest
    env:
      MOEBIUS_E2E_PODMAN: "1"
      MOEBIUS_E2E_IMAGE: docker.io/library/debian:stable-slim
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - name: Install pasta and pull the image
        run: |
          # The runner has Podman; pasta, which makes the containers' network, is passt. The runner's package is too
          # old for `--splice-only`, and its AppArmor profile (which follows /usr/bin/pasta) is too narrow for a newer
          # pasta, so a pinned release goes to /usr/local, which the profile does not cover and the PATH reaches first.
          git clone --branch 2026_10_02.cba3570 --depth 1 https://passt.top/passt "$RUNNER_TEMP/passt"
          make -C "$RUNNER_TEMP/passt"
          sudo make -C "$RUNNER_TEMP/passt" install prefix=/usr/local
          command -v pasta
          pasta --version | head -n 1
          podman --version
          podman info --format '{{.Host.Security.Rootless}}' | grep -qx true
          podman pull "$MOEBIUS_E2E_IMAGE"
      - run: cargo test -p moebius-plugin-container-sandbox --test e2e -- --nocapture

  e2e-docker:
    name: end to end with Docker
    runs-on: ubuntu-latest
    env:
      MOEBIUS_E2E_DOCKER: "1"
      MOEBIUS_E2E_IMAGE: docker.io/library/debian:stable-slim
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - name: Pull the image
        run: |
          # The runner's Docker runs as root, and the runner's user is in the group docker.
          docker version
          docker pull "$MOEBIUS_E2E_IMAGE"
      - run: cargo test -p moebius-plugin-container-sandbox --test e2e -- --nocapture
