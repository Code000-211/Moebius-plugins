[workspace]
resolver = "2"
members = ["plugins/*", "tools/index"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/Code000-211/moebius-plugins"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Debug builds keep file and line numbers for backtraces but not full debug information, which fills the disk.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
